services:
  - type: web
    name: lilla-visualization
    runtime: python
    plan: free
    buildCommand: python -m pip install -r requirements-deploy.txt
    startCommand: sh src/visualization/start.sh
    healthCheckPath: /_stcore/health
    autoDeployTrigger: "off"
    envVars:
      - key: LILLA_BIND_ADDRESS
        value: 0.0.0.0
      - key: LILLA_RESULTS_DIR
        value: /tmp/lilla-results
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: NUMBA_NUM_THREADS
        value: "1"
