<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Protocol tree</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: transparent; }
    #viewport { width: 100%; overflow-x: auto; padding: 3px 0; }
    #tree { position: relative; margin: auto; }
    svg { position: absolute; inset: 0; pointer-events: none; }
    .node {
      position: absolute; transform: translate(-50%, -50%);
      width: 44px; height: 44px; border-radius: 50%;
      border: 1.5px solid #64748b; background: white; color: #0f172a;
      text-align: center; font: 500 18px/1 system-ui, sans-serif; padding: 0;
      appearance: textfield; -moz-appearance: textfield;
    }
    input.node::-webkit-inner-spin-button,
    input.node::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    input.node:hover { border-color: #2563eb; }
    input.node:focus { outline: 3px solid #bfdbfe; border-color: #2563eb; }
    input.node:invalid { border-color: #dc2626; }
    input.node:disabled { opacity: 0.65; }
    span.node { display: grid; place-items: center; }
  </style>
</head>
<body>
  <div id="viewport"><div id="tree" role="group" aria-label="Protocol tree"></div></div>
  <script src="editor.js"></script>
</body>
</html>
